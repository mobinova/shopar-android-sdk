name: Android SDK release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: ./gradlew -PshoparSdkVersion="${GITHUB_REF_NAME}" :contracts:assembleRelease :agency:assembleRelease :discovery:assembleRelease
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            agency/build/outputs/aar/agency-release.aar
            discovery/build/outputs/aar/discovery-release.aar
            contracts/build/outputs/aar/contracts-release.aar
