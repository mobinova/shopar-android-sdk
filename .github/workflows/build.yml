name: Android SDK build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :contracts:assembleRelease :agency:assembleRelease :discovery:assembleRelease :sample:assembleDebug
